[package]
name = "lexinote"
version = "1.0.0"
description = "A fast local English vocabulary notebook"
authors = ["Hoang Vu"]
edition = "2021"
license = "MIT"
repository = "https://github.com/hoangvu1806/NoteVocab"
readme = "../README.md"

[lib]
name = "lexinote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
