name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build and publish Windows installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: LexiNote v__VERSION__
          releaseBody: |
            Download the EXE installer for most Windows users or the MSI package for managed deployments.

            See CHANGELOG.md for release details. SHA-256 checksums are attached as SHA256SUMS.txt.
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle -Recurse -File -Include *.exe,*.msi
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content SHA256SUMS.txt
      - name: Upload checksums
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: SHA256SUMS.txt
          fail_on_unmatched_files: true
